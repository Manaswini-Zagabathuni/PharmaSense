name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.4
        env:
          MYSQL_DATABASE: pharmasense_test
          MYSQL_USER: pharmasense
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: mysql+pymysql://pharmasense:test-only-password@127.0.0.1:3306/pharmasense_test
      TEST_DATABASE_URL: mysql+pymysql://pharmasense:test-only-password@127.0.0.1:3306/pharmasense_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Apply migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
